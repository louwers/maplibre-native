name: pthread-key-probe

on:
  push:
    branches: [probe/pthread-keys]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    name: quick (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 900 apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools xvfb gcc

      - name: Versions
        run: |
          getconf -a | grep -i KEYS || true
          dpkg-query -W libvulkan1 mesa-vulkan-drivers libc6 | cat
          dpkg-query -W 'libllvm*' | cat || true
          gcc --version | head -1

      - name: ICD manifests
        run: |
          ls -la /usr/share/vulkan/icd.d/ /etc/vulkan/icd.d/ 2>&1 || true
          for f in /usr/share/vulkan/icd.d/*.json; do echo "--- $f"; cat "$f"; echo; done

      - name: Build
        run: |
          gcc -O1 -fPIC -shared -o libkeyshim.so keyshim.c -ldl -lpthread
          gcc -O1 -o probe probe.c -ldl -lvulkan
          glslangValidator -V probe.comp -o probe.spv

      - name: Probe (no shim)
        run: ./probe probe.spv 40

      - name: Probe (shim)
        if: always()
        run: LD_PRELOAD="$PWD/libkeyshim.so" KEYSHIM_FRAMES=24 ./probe probe.spv 40

      - name: Probe (shim, under xvfb-run like the render tests)
        if: always()
        run: xvfb-run -a env LD_PRELOAD="$PWD/libkeyshim.so" KEYSHIM_FRAMES=24 ./probe probe.spv 40

      - name: Probe (shim, loader pinned to lavapipe)
        if: always()
        run: |
          LVP=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "pinning VK_DRIVER_FILES=$LVP"
          VK_DRIVER_FILES="$LVP" LD_PRELOAD="$PWD/libkeyshim.so" KEYSHIM_FRAMES=24 ./probe probe.spv 40

      - name: Probe (pinned, under xvfb-run, no shim)
        if: always()
        run: |
          LVP=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          xvfb-run -a env VK_DRIVER_FILES="$LVP" ./probe probe.spv 40
